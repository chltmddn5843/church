name = "church"
main = "worker.ts"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
routes = [{ pattern = "www.wdchurch.com", custom_domain = true }]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
BETTER_AUTH_URL = "https://www.wdchurch.com"
EMAIL_FROM = "원당교회 <noreply@wdchurch.com>"
# Turnstile: public values only. The secret is a Worker secret (wrangler secret put TURNSTILE_SECRET).
TURNSTILE_SITE_KEY = "0x4AAAAAAFFuLCMFsK7lyByY"
TURNSTILE_HOSTNAMES = "www.wdchurch.com"
TURNSTILE_ACTION = "auth"

[secrets]
# Deploys refuse to go out without these, so login can never ship with Turnstile unconfigured.
required = ["BETTER_AUTH_SECRET", "TURNSTILE_SECRET", "YOUTUBE_API_KEY"]

[[kv_namespaces]]
binding = "AUTH_KV"
id = "1761effc850d48e9a0f74197828d2da5"

[[d1_databases]]
binding = "DB"
database_name = "church-db"
database_id = "9f9a1d51-75e2-4cc6-8345-1facbfef509d"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "POPUP_IMAGES"
bucket_name = "church"

[observability]
enabled = true
head_sampling_rate = 1

# Lets worker.ts key its page cache by deploy (see worker.ts).
[version_metadata]
binding = "CF_VERSION_METADATA"
